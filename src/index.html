<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <div class="bg-blue-100 h-20 p-5 ">
        <div class="flex">
            <div class="h-10 p-2" >
                <p class="whitespace-nowrap">Accept International Payments</p>
            </div>
            <div class="w-70">
                <ul class="flex flex-col items-center">
                    <li class="country-img">
                        <img src="images\australia.png" alt="Australia Flag Image" class="img-size">
                        <p>Australia</p>
                    </li>
                    <li class="country-img">
                        <img src="images\uae.png" alt="UAE Flag Image" class="img-size">
                        <p>UAE</p>
                    </li>
                    <li class="country-img">
                        <img src="images\france.png" alt="France Flag Image" class="img-size">
                        <p>France</p>
                    </li>
                    <li class="country-img">
                        <img src="images\singapore.png" alt="Singapore Flag Image" class="img-size">
                        <p>Singapore</p>
                    </li>
                    <li class="country-img">
                        <img src="images\italy.png" alt="Italy Flag Image" class="img-size">
                        <p>Italy</p>
                    </li>
                    <li class="country-img">
                        <img src="images\germany.png" alt="Germany Flag Image" class="img-size">
                        <p>Germany</p>
                    </li>
                    <li class="country-img">
                        <img src="images\saudiArabia.png" alt="Saudi Arabia Flag Image" class="img-size">
                        <p>Saudi Arabia</p>
                    </li>
                    <li class="country-img">
                        <img src="images\united-states.png" alt="USA" class="img-size">
                        <p>USA</p>
                    </li>
                    <li class="country-img">
                        <img src="images\uk.png" alt="United Kingdom Flag Image" class="img-size">
                        <p>United Kingdom</p>
                    </li>
                    <li class="country-img">
                        <img src="images\canada.png" alt="Canada Flag Image" class="img-size">
                        <p>Canada</p>
                    </li>
                </ul>
            </div>
            <div class="flex gap-1 bg-amber-500">
                <div>
                    <p>Global cards, Apple Pay, Google Pay at lower fee.</p>
                </div>
                <div>
                    <button>
                        <p class="bg-black text-white rounded-2xl p-2">KnowMore</p>
                    </button>
                </div>
            </div>

            <div class="bg-pink-50">
                <div>
                    <p>C$</p>
                </div>
                <div>
                    <p>CHF</p>
                </div>
                <div>
                    <p>S$</p>
                </div>
                <div>
                    <p>د.إ</p>
                </div>
                <div>
                    <p>€</p>
                </div>
            </div>

            <div>
                <img src="https://framerusercontent.com/images/XVkcABzIzkwrZgKb362vjGLJtLw.webp?width=875&height=985"
                    alt="world map">
            </div>
        </div>
    </div>
</body>

</html>
