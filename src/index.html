<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay</title>
    <link rel="stylesheet" href="output.css">
</head>

<body>
    <nav class="flex flex-row gap-10 mt-5 ml-40 fixed top-0 left-0 right-0 bg-white">
        <div><img src="https://1000logos.net/wp-content/uploads/2025/10/Razorpay-Logo.jpg" alt="RazorPay icon"
                class="h-15"></div>
        <div class="flex flex-row mt-5 gap-6">
            <div>
                <div class="peer hover:text-blue-600">
                    Agentic Stack
                </div>
                <div class="h-1 bg-blue-600 opacity-0 w-0 
                transition-all duration-500 ease-in-out
                peer-hover:opacity-100 peer-hover:w-full">
                </div>
            </div>
            <div>
                <div class="peer hover:text-blue-600">Payments</div>
                <div class="h-1 bg-blue-600 opacity-0 w-0 transition-all duration-500 ease-in-out peer-hover:opacity-100 peer-hover:w-full"></div>
            </div>
            <div>
                <div class="peer hover:text-blue-600">Banking+</div>
                <div class="h-1 bg-blue-600 w-0 opacity-0 transition-all duration-500 ease-in-out peer-hover:opacity-100 peer-hover:w-full"></div>
            </div>
            <div>
                <div class="peer hover:text-blue-600">Payroll</div>
                <div class="h-1 bg-blue-600 w-0 opacity-0 transition-all duration-500 ease-in-out peer-hover:opacity-100 peer-hover:w-full"></div>
            </div>
            <div>
                <div class="peer hover:text-blue-600">Engage</div>
                <div class="h-1 bg-blue-600 w-0 opacity-0 transition-all duration-500 ease-in-out peer-hover:opacity-100 peer-hover:w-full"></div>
            </div>
            <div>
                <div class="peer hover:text-blue-600">Partners</div>
                <div class="h-1 bg-blue-600 w-0 opacity-0 transition-all duration-500 ease-in-out peer-hover:opacity-100 peer-hover:w-full"></div>
            </div>
            <div>
                <div class="peer hover:text-blue-600">Startups</div>
                <div class="h-1 bg-blue-600 w-0 opacity-0 transition-all duration-500 ease-in-out peer-hover:opacity-100 peer-hover:w-full"></div>
            </div>
            <div>
                <div class="peer hover:text-blue-600">Resources</div>
                <div class="h-1 bg-blue-600 w-0 opacity-0 transition-all duration-500 ease-in-out peer-hover:opacity-100 peer-hover:w-full"></div>
            </div>
            <div>
                <div class="peer hover:text-blue-600">Pricing</div>
                <div class="h-1 bg-blue-600 w-0 opacity-0 transition-all duration-500 ease-in-out peer-hover:opacity-100 peer-hover:w-full"></div>
            </div>
        </div>
        <div class="h-15"></div>
        <div class="flex flex-row mt-3 gap-5">
            <img src="images\customer-service-headset.png" alt="headset " class="h-7 mt-2">
            <div class="flex">
                <img src="images\indiaFlag.png" alt="India flag" class="h-7  mt-2">
                <span class="mt-2">&#8964;</span>
            </div>
            <button class="text-blue-700 border border-indigo-700 w-20 h-10 rounded-sm hover:bg-blue-100">Login</button>
            <button class="bg-blue-600 text-white w-25 h-10 rounded-sm hover:bg-blue-700">Sign Up →</button>
        </div>
    </nav>
</body>

</html>
